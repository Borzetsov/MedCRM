services:
  med-crm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: med-crm
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - med-crm-local-network

  database:
    image: postgres:15-alpine
    container_name: database
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${SPRING_DATASOURCE_NAME:-postgres}
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-root}
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${SPRING_DATASOURCE_USERNAME:-postgres} -d ${SPRING_DATASOURCE_NAME:-postgres}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - med-crm-local-network

volumes:
  database_data: { }

networks:
  med-crm-local-network:
    driver: bridge