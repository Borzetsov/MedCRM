<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Регистрация нового пациента</title>
</head>
<body>
<form th:action="@{/patients/registration}" method="post">
    <input type="text" name="login" placeholder="Логин" required>
    <input type="password" name="password" placeholder="Пароль" required>
    <br>
    <input type="text" name="firstName" placeholder="Имя" required>
    <input type="text" name="lastName" placeholder="Фамилия" required>
    <input type="date" name="birthDate" placeholder="Дата рождения" required>
    <input type="text" name="gender" placeholder="Пол" required>
    <input type="text" name="phone" placeholder="Номер телефона" required>
    <input type="email" name="email" placeholder="email" required>
    <button>Регистрация</button>
</form>
<form th:action="@{/auth/login}" method="get">
    <button type="submit" class="btn">Назад</button>
</form>
</body>
</html>
