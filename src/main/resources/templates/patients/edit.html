<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактирование профиля</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>
<body>
<div th:replace="~{fragments/layout :: header-fragment}"></div>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-4 col-md-6 col-lg-4">
            <form th:action="@{/patients/profile/update}"
                  th:object="${currentPatient}" method="post">
                <input type="hidden" th:field="*{id}">
                <input type="hidden" th:field="*{account}">
                <label>Имя</label>
                <input class="form-control" type="text" th:field="*{firstName}" placeholder="Имя">
                <label>Фамилия</label>
                <input class="form-control" type="text" th:field="*{lastName}" placeholder="Фамилия">
                <label for="birthDate" class="form-label">Дата рождения</label>
                <input type="text" class="form-control w-12" id="birthDate" name="birthDate"
                       th:field="*{birthDate}"
                       data-bs-toggle="datepicker" autocomplete="off" placeholder="Укажите дату…">
                <label>Пол</label>
                <div class="form-field">
                    <input class="radio" name="gender" type="radio" id="radioLabel" th:field="*{gender}" value="MALE"/>
                    <label for="radioLabel">М</label>
                </div>
                <div class="form-field">
                    <input class="radio" name="gender" type="radio" id="radioLabel2" th:field="*{gender}"
                           value="FEMALE"/>
                    <label for="radioLabel2">Ж</label>
                </div>
                <label>Номер телефона</label>
                <input class="form-control" type="text" th:field="*{phone}" placeholder="Номер телефона">
                <label>email</label>
                <input class="form-control" type="email" th:field="*{email}" placeholder="email">
                <button class="btn" type="submit">Сохранить</button>
            </form>
        </div>
    </div>
</div>

<a class="btn" sec:authorize="hasRole('PATIENT')" th:href="@{/patients/profile}">Назад</a><br>

<div th:replace="~{fragments/layout :: footer-fragment}"></div>
<script type="module"
        src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
</body>
</html>
