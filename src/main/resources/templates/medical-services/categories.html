<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Категории медицинских услуг</title>
</head>
<body>
<form sec:authorize="hasRole('ADMINISTRATOR_CRM')" th:action="@{/administration/medical-services/categories}" method="post">
    <input type="text" name="name" placeholder="Название категории">
    <br>
    <label for="defaultProfessionalCategory">Категория медицинского работника</label>
    <br>
    <select id="defaultProfessionalCategory" name="defaultProfessionalCategory" required>
        <option value="">--Выбериет категорию--</option>
        <option th:each="cat : ${medicalProfessionalCategories}"
                th:value="${cat.id}"
                th:text="${cat.name}">Название</option>
    </select>
    <br>
    <button>Добавить</button>
</form>
<br>
<ol>
    <li th:each="medicalServiceCategory : ${medicalServiceCategories}">
        <span th:text="${medicalServiceCategory.getName()}">Название</span>
        <a sec:authorize="hasRole('ADMINISTRATOR_CRM')" th:href="@{/administration/medical-services/categories/edit(id=${medicalServiceCategory.getId()})}">Редактировать</a>
        <form sec:authorize="hasRole('ADMINISTRATOR_CRM')"  th:action="@{/administration/medical-services/categories/delete/{id}(id=${medicalServiceCategory.getId()})}" method="post">
            <button type="submit" onclick="return confirm('Удалить категорию?')">Удалить</button>
        </form>
    </li>
</ol>

<a sec:authorize="hasRole('ADMINISTRATOR_CRM')" th:href="@{/administration}">Назад</a><br>
<a sec:authorize="hasRole('PATIENT')" th:href="@{/patients/profile}">Назад</a><br>

<form th:action="@{/logout}" method="post">
    <button type="submit" class="btn">Выйти</button>
</form>
</body>
</html>
