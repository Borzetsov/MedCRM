<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Категории медицинских услуг</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>
<body>
<div th:replace="~{fragments/layout :: header-fragment}"></div>

<div class="container text-center">
    <div class="row">
        <div class="col-4">
            <form sec:authorize="hasRole('ADMINISTRATOR_CRM')"
                  th:action="@{/administration/medical-services/categories}"
                  method="post">
                <label>Добавить категорию</label><br>
                <input class="form-control" type="text" name="name" placeholder="Название категории" required>
                <label for="defaultProfessionalCategory">Требуемая категория медицинского работника</label>
                <select class="form-control" id="defaultProfessionalCategory" name="defaultProfessionalCategory"
                        required>
                    <option value="">--Выберите категорию--</option>
                    <option th:each="cat : ${medicalProfessionalCategories}"
                            th:value="${cat.id}"
                            th:text="${cat.name}">Название
                    </option>
                </select>
                <button class="btn">Добавить</button>
            </form>
        </div>
        <div class="col">
            <label>Список категорий медицинских услуг</label>
            <ol class="list-group">
                <li th:each="medicalServiceCategory : ${medicalServiceCategories}" class="list-group-item">
                    <div class="row">
                        <div class="col">
                            <span th:text="${medicalServiceCategory.getName()}">Название</span>
                        </div>
                        <div class="col">
                            <a class="btn" sec:authorize="hasRole('ADMINISTRATOR_CRM')"
                               th:href="@{/administration/medical-services/categories/edit(id=${medicalServiceCategory.getId()})}">Редактировать</a>
                        </div>
                        <div class="col">
                            <form sec:authorize="hasRole('ADMINISTRATOR_CRM')"
                                  th:action="@{/administration/medical-services/categories/delete/{id}(id=${medicalServiceCategory.getId()})}"
                                  method="post">
                                <button class="btn" type="submit" onclick="return confirm('Удалить категорию?')">
                                    Удалить
                                </button>
                            </form>
                        </div>
                    </div>
                </li>
            </ol>
        </div>
    </div>
</div>

<a class="btn" sec:authorize="hasRole('ADMINISTRATOR_CRM')" th:href="@{/administration}">Назад</a><br>
<a class="btn" sec:authorize="hasRole('PATIENT')" th:href="@{/patients/profile}">Назад</a><br>

<div th:replace="~{fragments/layout :: footer-fragment}"></div>
<script type="module"
        src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
</body>
</html>
