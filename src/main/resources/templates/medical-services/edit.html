<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактирование медицинской услуги</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>
<body>
<div th:replace="~{fragments/layout :: header-fragment}"></div>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-4 col-md-6 col-lg-4">
            <form sec:authorize="hasRole('ADMINISTRATOR_CRM')" th:action="@{/administration/medical-services/update}"
                  th:object="${medicalService}" method="post">
                <input type="hidden" name="serviceId" th:value="${currentServiceId}">
                <input type="hidden" name="categoryId" th:value="${currentCategoryId}">
                <label>Название</label>
                <input class="form-control" type="text" th:field="*{name}" placeholder="Название услуги" required>
                <label for="category">Категория</label>
                <select class="form-control" id="category" name="category" required>
                    <option value="">--Выберите категорию--</option>
                    <option th:each="cat : ${medicalServiceCategories}"
                            th:value="${cat.name}"
                            th:text="${cat.name}">Название</option>
                </select>
                <label>Цена</label>
                <input class="form-control" type="text" th:field="*{price}" placeholder="Цена" required>
                <button class="btn" type="submit">Сохранить</button>
            </form>
        </div>
    </div>
</div>

<a class="btn" sec:authorize="hasRole('ADMINISTRATOR_CRM')" th:href="@{/administration/medical-services}">Назад</a><br>

<div th:replace="~{fragments/layout :: footer-fragment}"></div>
<script type="module"
        src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
</body>
</html>
