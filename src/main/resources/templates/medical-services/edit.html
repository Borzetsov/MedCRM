<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактирование медицинской услуги</title>
</head>
<body>
<form sec:authorize="hasRole('ADMINISTRATOR_CRM')" th:action="@{/administration/medical-services/update}"
      th:object="${medicalService}" method="post">

    <input type="hidden" name="serviceId" th:value="${currentServiceId}">
    <input type="hidden" name="categoryId" th:value="${currentCategoryId}">

    <label>Название</label>
    <input type="text" th:field="*{name}" placeholder="Название услуги"><br>

    <label for="category">Категория</label>
    <select id="category" name="category" required>
        <option value="">--Выбериет категорию--</option>
        <option th:each="cat : ${medicalServiceCategories}"
                th:value="${cat.name}"
                th:text="${cat.name}">Название</option>
    </select>

    <label>Цена</label>
    <input type="text" th:field="*{price}" placeholder="Цена"><br>

    <button type="submit">Сохранить</button>
</form>

<a sec:authorize="hasRole('ADMINISTRATOR_CRM')" th:href="@{/administration/medical-services}">Назад</a><br>

<form th:action="@{/logout}" method="post">
    <button type="submit" class="btn">Выйти</button>
</form>
</body>
</html>
