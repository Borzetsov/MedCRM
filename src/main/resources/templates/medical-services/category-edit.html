<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактирование категории медицинских услуг</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>
<body>
<div th:replace="~{fragments/layout :: header-fragment}"></div>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-4 col-md-6 col-lg-4">
            <form sec:authorize="hasRole('ADMINISTRATOR_CRM')"
                  th:action="@{/administration/medical-services/categories/update}"
                  th:object="${medicalServiceCategory}" method="post">
                <input type="hidden" th:field="*{id}">
                <label>Название</label>
                <input class="form-control" type="text" th:field="*{name}" placeholder="Название категории" required>
                <button class="btn" type="submit">Сохранить</button>
            </form>
        </div>
    </div>
</div>

<a class="btn" sec:authorize="hasRole('ADMINISTRATOR_CRM')" th:href="@{/administration/medical-services/categories}">Назад</a>

<div th:replace="~{fragments/layout :: footer-fragment}"></div>
<script type="module"
        src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
</body>
</html>
