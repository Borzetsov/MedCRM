<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Медицинские услуги</title>
</head>
<body>

<form th:action="@{/appointments/services}" method="post">
    <label for="medicalServiceName"></label>
    <select id="medicalServiceName" name="medicalServiceName" required>
        <option value="">--Выбериет услугу--</option>
        <option th:each="service : ${medicalServices}"
                th:value="${service.name}"
                th:text="${service.name}">Услуга</option>
    </select>
    <button type="submit" class="btn">Посмотреть доступные даты</button>
</form>

<a sec:authorize="hasRole('PATIENT')" th:href="@{/patients/profile}">В личный кабинет</a><br>

<form th:action="@{/logout}" method="post">
    <button type="submit" class="btn">Выйти</button>
</form>
</body>
</html>
