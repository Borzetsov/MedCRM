<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список приемов</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>
<body>
<div th:replace="~{fragments/layout :: header-fragment}"></div>

<div class="container text-center">
    <div class="row">
        <div class="col-8">
            <label>Список приемов</label>
            <ol class="list-group">
                <li th:each="appointment : ${appointments}" class="list-group-item">
                    <div class="row">
                        <div class="col">
                            <label>Дата приема:</label><br>
                            <span th:text="${appointment.getAppointmentDate()}"></span>
                        </div>
                        <div class="col">
                            <label>Время:</label><br>
                            <span th:text="${(30 * (15 + appointment.getTimeslot())) / 60}
                            + ':' + ${#numbers.formatInteger((30 * (15 + appointment.getTimeslot())) % 60, 2)}"></span>
                        </div>
                        <div class="col">
                            <label>Услуга:</label><br>
                            <span th:text="${appointment.getMedicalService().name}"></span>
                        </div>
                        <div class="col">
                            <label>Врач:</label><br>
                            <span th:text="${appointment.getMedicalProfessional().firstName}"></span>
                            <span th:text="${appointment.getMedicalProfessional().lastName}"></span>
                        </div>
                        <div class="col">
                            <form th:if="${appointment.status != 'FINISHED'}" sec:authorize="hasRole('PATIENT')"
                                  th:action="@{/appointments/cancel}" method="post">
                                <input type="hidden" name="appointmentId" th:value="${appointment.id}"/>
                                <button type="submit" onclick="return confirm('Отменить прием?')">Отменить</button>
                            </form>
                            <label th:if="${appointment.status == 'FINISHED'}" th:value="${appointment.status}"></label>
                        </div>
                    </div>
                </li>
            </ol>
        </div>
    </div>
</div>

<a class="btn" sec:authorize="hasRole('PATIENT')" th:href="@{/patients/profile}">Назад</a><br>

<div th:replace="~{fragments/layout :: footer-fragment}"></div>
<script type="module"
        src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
</body>
</html>
