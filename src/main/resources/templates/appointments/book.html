<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Запись на прием</title>
</head>
<body>

<div th:each="timeslotsForDay : ${timeslotsForWeek}">
    <div th:each="timeslots : ${timeslotsForDay}">
        <span th:text="${timeslots.key}"></span>
        <br>
        <span th:each="slot : ${timeslots.value}">
            <form th:action="@{/appointments/book(
            serviceId=${medicalService.getId().getId()},
            categoryId=${medicalService.getRequiredMedicalProfessionalCategory().getId()},
            appointmentDate=${timeslots.key},
            timeslot=${slot})}"
                  method="post"
                  style="display: inline-block">
                <button type="submit" class="btn" th:text="${slot}"></button>
            </form>
        </span>
    </div>
    <br>
</div>

<a sec:authorize="hasRole('PATIENT')" th:href="@{/patients/profile}">Назад</a><br>
<br>
<form th:action="@{/logout}" method="post">
    <button type="submit" class="btn">Выйти</button>
</form>
</body>
</html>
