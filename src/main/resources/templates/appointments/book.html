<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Запись на прием</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>
<body>
<div th:replace="~{fragments/layout :: header-fragment}"></div>

<div class="container text-center">
    <div class="row">
        <div class="col">
            <label>Выберите дату и время</label>
            <div th:each="timeslotsForDay : ${timeslotsForWeek}">
                <div th:each="timeslots : ${timeslotsForDay}">
                    <span th:text="${timeslots.key.dayOfMonth} + ' ' + ${timeslots.key.month}"></span>
                    <br>
                    <span th:each="slot : ${timeslots.value}">
                        <form th:action="@{/appointments/book(
                        serviceId=${medicalService.getId().getId()},
                        categoryId=${medicalService.getRequiredMedicalProfessionalCategory().getId()},
                        appointmentDate=${timeslots.key},
                        timeslot=${slot})}" method="post" style="display: inline-block">
                            <button type="submit" class="btn" th:text="${(30 * (15 + slot)) / 60}
                            + ':' + ${#numbers.formatInteger((30 * (15 + slot)) % 60, 2)}"></button>
                        </form>
                    </span>
                </div>
            </div>
        </div>
    </div>
</div>

<a class="btn" sec:authorize="hasRole('PATIENT')" th:href="@{/patients/profile}">В личный кабинет</a><br>

<div th:replace="~{fragments/layout :: footer-fragment}"></div>
<script type="module"
        src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
</body>
</html>
