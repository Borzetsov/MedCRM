<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Личный кабинет медицинского работника</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>
<body>
<div th:replace="~{fragments/layout :: header-fragment}"></div>

<div class="container text-center">
    <div class="row">
        <div class="col-3">
            <label th:text="${medicalProfessional.firstName}"></label><br>
            <label th:text="${medicalProfessional.lastName}"></label><br>
            <label th:text="${medicalProfessional.category.name}"></label><br>
        </div>
        <div class="col">
            <a class="btn" th:href="@{/medical-professionals/appointments}">Предстоящие приемы</a>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer-fragment}"></div>
<script type="module"
        src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
</body>
</body>
</html>
