<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Медицинские работники</title>
</head>
<body>
<form th:action="@{/administration/medical-professionals}" method="post">
    <input type="text" name="firstName" placeholder="Имя">
    <br>
    <input type="text" name="lastName" placeholder="Фамилия">
    <br>
    <label for="category">Категория медицинского работника</label>
    <br>
    <select id="category" name="category" required>
        <option value="">--Выбериет категорию--</option>
        <option th:each="cat : ${medicalProfessionalCategories}"
                th:value="${cat.name}"
                th:text="${cat.name}">Название</option>
    </select>
    <br>
    <button>Добавить</button>
</form>
<br>
<ol>
    <li th:each="medicalProfessional : ${medicalProfessionals}">
        <span th:text="${medicalProfessional.getFirstName()}">Мия</span>
        <span th:text="${medicalProfessional.getLastName()}">Фамилия</span>
        <span th:text="${medicalProfessional.getCategory().getName()}">Категория</span>
        <a th:href="@{/administration/medical-professionals/edit(professionalId=${medicalProfessional.getId().getId()}, categoryId=${medicalProfessional.getId().getCategory()})}">Редактировать</a>
        <form th:action="@{/administration/medical-professionals/delete(id=${medicalProfessional.getId().getId()}, categoryId=${medicalProfessional.getId().getCategory()})}" method="post">
            <button type="submit" onclick="return confirm('Удалить медицинского работника?')">Удалить</button>
        </form>
    </li>
</ol>
<a th:href="@{/administration}">Назад</a><br>

<form th:action="@{/logout}" method="post">
    <button type="submit" class="btn">Выйти</button>
</form>
</body>
</html>
