<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Медицинские работники</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>
<body>
<div th:replace="~{fragments/layout :: header-fragment}"></div>

<div class="container text-center">
    <div class="row">
        <div class="col-4">
            <form th:action="@{/administration/medical-professionals}" method="post">
                <label>Добавить медицинского работника</label><br>
                <input class="form-control" type="text" name="firstName" placeholder="Имя" required>
                <input class="form-control" type="text" name="lastName" placeholder="Фамилия" required>
                <input type="text" name="login" class="form-control" id="loginInput" placeholder="Логин" required>
                <input type="password" name="password" class="form-control" id="passwordInput" placeholder="Пароль"
                       required>
                <label for="category">Категория медицинского работника</label>
                <select class="form-control" id="category" name="category" required>
                    <option value="">--Выберите категорию--</option>
                    <option th:each="cat : ${medicalProfessionalCategories}"
                            th:value="${cat.name}"
                            th:text="${cat.name}">Название
                    </option>
                </select>
                <button class="btn" type="submit">Добавить</button>
            </form>
        </div>
        <div class="col">
            <label>Список медицинских работников</label>
            <ol class="list-group">
                <li th:each="medicalProfessional : ${medicalProfessionals}" class="list-group-item">
                    <div class="row">
                        <div class="col">
                            <span th:text="${medicalProfessional.getFirstName()}">Имя</span>
                        </div>
                        <div class="col">
                            <span th:text="${medicalProfessional.getLastName()}">Фамилия</span>
                        </div>
                        <div class="col">
                            <span th:text="${medicalProfessional.getCategory().getName()}">Категория</span>
                        </div>
                        <div class="col">
                            <a class="btn"
                               th:href="@{/administration/medical-professionals/edit(professionalId=${medicalProfessional.getId().getId()}, categoryId=${medicalProfessional.getId().getCategory()})}">Редактировать</a>
                        </div>
                        <div class="col">
                            <form th:action="@{/administration/medical-professionals/delete(id=${medicalProfessional.getId().getId()}, categoryId=${medicalProfessional.getId().getCategory()})}"
                                  method="post">
                                <button class="btn" type="submit"
                                        onclick="return confirm('Удалить медицинского работника?')">
                                    Удалить
                                </button>
                            </form>
                        </div>
                    </div>
                </li>
            </ol>
        </div>
    </div>
</div>

<a class="btn" th:href="@{/administration}">Назад</a>

<div th:replace="~{fragments/layout :: footer-fragment}"></div>
<script type="module"
        src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
</body>
</html>
