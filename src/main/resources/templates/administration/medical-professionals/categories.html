<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Категории медицинских работников</title>
</head>
<body>
<form th:action="@{/administration/medical-professionals/categories}" method="post">
    <input type="text" name="name" placeholder="Название категории">
    <button>Добавить</button>
</form>
<br>
<ol>
    <li th:each="medicalProfessionalCategory : ${medicalProfessionalCategories}">
        <span th:text="${medicalProfessionalCategory.getName()}">Название</span>
        <a th:href="@{/administration/medical-professionals/categories/edit(id=${medicalProfessionalCategory.getId()})}">Редактировать</a>
        <form th:action="@{/administration/medical-professionals/categories/delete/{id}(id=${medicalProfessionalCategory.getId()})}" method="post">
            <button type="submit" onclick="return confirm('Удалить категорию?')">Удалить</button>
        </form>
    </li>
</ol>
<a th:href="@{/administration}">Назад</a><br>

<form th:action="@{/logout}" method="post">
    <button type="submit" class="btn">Выйти</button>
</form>
</body>
</html>
