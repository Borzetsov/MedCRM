<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактирование категории медицинских услуг</title>
</head>
<body>
<form th:action="@{/administration/medical-services/categories/update}"
      th:object="${medicalServiceCategory}" method="post">
    <input type="hidden" th:field="*{id}">
    <label>Название</label>
    <input type="text" th:field="*{name}" placeholder="Название категории">
    <button type="submit">Сохранить</button>
</form>

<a th:href="@{/administration/medical-services/categories}">Назад</a><br>

<form th:action="@{/logout}" method="post">
    <button type="submit" class="btn">Выйти</button>
</form>

</body>
</html>
