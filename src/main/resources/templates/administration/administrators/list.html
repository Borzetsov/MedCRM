<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Администраторы</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>
<body>
<div th:replace="~{fragments/layout :: header-fragment}"></div>

<div class="container text-center">
    <div class="row">
        <div class="col-3">
            <label>Добавить администратора</label><br>
            <form th:action="@{/administration/administrators}" method="post">
                <input type="text" name="firstName" placeholder="Имя" aria-label="First name" class="form-control"
                       required>
                <input type="text" name="lastName" placeholder="Фамилия" aria-label="Last name" class="form-control"
                       required>
                <button type="submit" class="btn">Добавить</button>
            </form>
        </div>
        <div class="col">
            <label>Список администраторов</label>
            <ol class="list-group">
                <li th:each="administrator : ${administrators}" class="list-group-item">
                    <div class="row">
                        <div class="col">
                            <span th:text="${administrator.getLastName()}">Фамилия</span>
                        </div>
                        <div class="col">
                            <span th:text="${administrator.getFirstName()}">Имя</span>
                        </div>
                        <div class="col">
                            <a class="btn"
                               th:href="@{/administration/administrators/edit(id=${administrator.getId()})}">Редактировать</a>
                        </div>
                        <div class="col">
                            <form th:action="@{/administration/administrators/delete/{id}(id=${administrator.getId()})}"
                                  method="post">
                                <button type="submit" class="btn" onclick="return confirm('Удалить администратора?')">
                                    Удалить
                                </button>
                            </form>
                        </div>
                    </div>
                </li>
            </ol>
        </div>
    </div>
</div>

<a class="btn" th:href="@{/administration}">Назад</a><br>

<div th:replace="~{fragments/layout :: footer-fragment}"></div>
<script type="module"
        src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
</body>
</html>
