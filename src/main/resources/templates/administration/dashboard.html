<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Администрирование CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>
<body>
<div th:replace="~{fragments/layout :: header-fragment}"></div>

<div class="container text-center">
    <div class="row">
        <div class="col">
            <a th:href="@{/administration/administrators}" class="btn-solid theme-primary">Администраторы</a><br>
        </div>
        <div class="col">
            <a th:href="@{/administration/medical-professionals/categories}" class="btn-solid theme-primary">Категории
                медицинских работников</a><br>
        </div>
        <div class="col">
            <a th:href="@{/administration/medical-services/categories}" class="btn-solid theme-primary">Категории
                медицинских услуг</a><br>
        </div>
        <div class="col">
            <a th:href="@{/administration/medical-services}" class="btn-solid theme-primary">Медицинские услуги</a><br>
        </div>
        <div class="col">
            <a th:href="@{/administration/medical-professionals}" class="btn-solid theme-primary">Медицинские
                работники</a><br>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer-fragment}"></div>
<script type="module"
        src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
</body>
</html>
